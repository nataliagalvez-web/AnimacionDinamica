<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Rotate to Mouse</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <canvas id="canvas" width="1000" height="700"></canvas>
    <aside>Move mouse on canvas element.</aside>
    
    <script src="utils.js"></script>
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          mouse = utils.captureMouse(canvas),
          pelota = new Image();

      // Dimensiones medianas
      var anchoDeseado = 120;
      var altoDeseado = 120;

      pelota.onload = function () {
        (function drawFrame () {
          window.requestAnimationFrame(drawFrame);
          context.clearRect(0, 0, canvas.width, canvas.height);
          
          context.save();
          var x = canvas.width / 2,
              y = canvas.height / 2;

          context.translate(x, y);
          
          var dx = mouse.x - x,
              dy = mouse.y - y;
          
          var radianes = Math.atan2(dy, dx);
          context.rotate(radianes);
          
          // Dibuja la imagen centrada con tamaño mediano
          context.drawImage(
            pelota, 
            -anchoDeseado / 2, 
            -altoDeseado / 2, 
            anchoDeseado, 
            altoDeseado
          );
          
          context.restore();
        }());
      };

      pelota.src = 'emoji.jpe';
    };
    </script>
  </body>
</html>
